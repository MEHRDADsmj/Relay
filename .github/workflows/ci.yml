name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Unit tests with race and coverage
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error

  integration:
    name: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Integration tests
        run: make test-integration

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: End-to-end tests
        run: make test-e2e

  generated:
    name: generated
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check generated code is up to date
        run: make check-generated

  docker:
    name: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build relay-server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: false
          tags: relay-server:ci
          build-args: |
            CMD=relay-server
          cache-from: type=gha
          cache-to: type=gha,mode=max

  promtool:
    name: promtool
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Prometheus alert rules
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/deploy/observability:/etc/prometheus:ro" \
            prom/prometheus:v3.2.1 \
            check rules /etc/prometheus/alerts.yml

  helm:
    name: helm
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Install chart-testing
        uses: helm/chart-testing-action@v2.7.0

      - name: helm lint
        run: helm lint deploy/helm/relay

      - name: ct lint
        run: ct lint --config ct.yaml

      - name: Build relay-server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: false
          load: true
          tags: relay-server:ci
          build-args: |
            CMD=relay-server
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build relayctl
        run: |
          mkdir -p bin
          go build -o bin/relayctl ./cmd/relayctl

      - name: Create kind cluster
        uses: helm/kind-action@v1.12.0
        with:
          cluster_name: relay-helm
          wait: 120s

      - name: Load image into kind
        run: kind load docker-image relay-server:ci --name relay-helm

      - name: Install Postgres + Redis deps
        run: |
          kubectl apply -f deploy/helm/ci/postgres.yaml
          kubectl apply -f deploy/helm/ci/redis.yaml
          kubectl -n relay-deps rollout status deploy/postgres --timeout=180s
          kubectl -n relay-deps rollout status deploy/redis --timeout=120s

      - name: Kind smoke (postgres)
        run: bash deploy/helm/ci/smoke.sh postgres

      - name: Kind smoke (redis)
        run: bash deploy/helm/ci/smoke.sh redis

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Run govulncheck
        run: govulncheck ./...

  goreleaser:
    name: goreleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check GoReleaser config
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check
