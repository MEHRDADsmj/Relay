# Prometheus scrape config for the local Relay compose stack (profile: observability).
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Docker Compose DNS returns all replica A records for the service name.
  - job_name: relay-server
    metrics_path: /metrics
    dns_sd_configs:
      - names:
          - relay-server
          - relay-server-2
        type: A
        port: 7429
        refresh_interval: 10s

  - job_name: example-worker
    metrics_path: /metrics
    dns_sd_configs:
      - names:
          - example-worker
        type: A
        port: 9464
        refresh_interval: 10s
