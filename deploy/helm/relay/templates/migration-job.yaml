{{- /* Render only when credentials exist so `helm lint` on defaults stays clean.
     Pre-install hook runs before chart Secret exists; inline URL or existingSecret. */ -}}
{{- $hasPostgresCreds := or .Values.secret.existingSecret .Values.secret.postgresUrl -}}
{{- if and .Values.migration.enabled (eq .Values.config.storage "postgres") $hasPostgresCreds -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "relay.fullname" . }}-migrate
  labels:
    {{- include "relay.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    {{- with .Values.migration.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "relay.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "relay.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["migrate", "up"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: RELAY_STORAGE
              value: "postgres"
            - name: RELAY_POSTGRES_URL
              {{- if .Values.secret.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.existingSecret }}
                  key: RELAY_POSTGRES_URL
              {{- else }}
              value: {{ .Values.secret.postgresUrl | quote }}
              {{- end }}
          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
