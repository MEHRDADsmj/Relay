# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: relay

builds:
  - id: relay-server
    main: ./cmd/relay-server
    binary: relay-server
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.FullCommit}} -X main.date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

  - id: relayctl
    main: ./cmd/relayctl
    binary: relayctl
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.FullCommit}} -X main.date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

sboms:
  - id: archives
    artifacts: archive

dockers_v2:
  - id: relay-server
    ids:
      - relay-server
    dockerfile: deploy/docker/Dockerfile.goreleaser-server
    images:
      - ghcr.io/mehrdadsmj/relay-server
    tags:
      - "{{ .Version }}"
      - "{{ if not .IsSnapshot }}latest{{ end }}"
      - "{{ if not .IsSnapshot }}{{ .Tag }}{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: relay-server
      org.opencontainers.image.description: Relay job queue server
      org.opencontainers.image.source: https://github.com/MEHRDADsmj/Relay
      org.opencontainers.image.licenses: MIT
    annotations:
      "index,manifest:org.opencontainers.image.source": https://github.com/MEHRDADsmj/Relay
      "index,manifest:org.opencontainers.image.revision": "{{ .FullCommit }}"
      "index,manifest:org.opencontainers.image.version": "{{ .Version }}"

  - id: relayctl
    ids:
      - relayctl
    dockerfile: deploy/docker/Dockerfile.goreleaser-relayctl
    images:
      - ghcr.io/mehrdadsmj/relayctl
    tags:
      - "{{ .Version }}"
      - "{{ if not .IsSnapshot }}latest{{ end }}"
      - "{{ if not .IsSnapshot }}{{ .Tag }}{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: relayctl
      org.opencontainers.image.description: Relay CLI
      org.opencontainers.image.source: https://github.com/MEHRDADsmj/Relay
      org.opencontainers.image.licenses: MIT
    annotations:
      "index,manifest:org.opencontainers.image.source": https://github.com/MEHRDADsmj/Relay
      "index,manifest:org.opencontainers.image.revision": "{{ .FullCommit }}"
      "index,manifest:org.opencontainers.image.version": "{{ .Version }}"

changelog:
  use: git
  sort: asc
  abbrev: -1
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Documentation
      regexp: '^.*?docs(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Performance
      regexp: '^.*?perf(\([[:word:]]+\))??!?:.+$'
      order: 3
    - title: Others
      order: 999
  filters:
    exclude:
      - '^chore(\(.*\))?:'
      - '^ci(\(.*\))?:'
      - '^test(\(.*\))?:'
      - '^style(\(.*\))?:'
      - '^build(\(.*\))?:'
      - '^refactor(\(.*\))?:'
      - '^Merge pull request'
      - '^Merge branch'

release:
  github:
    owner: MEHRDADsmj
    name: Relay
  # TODO(docs/P4-T7): optional cosign keyless signing of binaries and images.

snapshot:
  version_template: "{{ .Version }}-next"

# Dist artifacts are local-only; never commit.
dist: dist
