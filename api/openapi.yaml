openapi: 3.0.3
info:
  title: Relay API
  description: |
    HTTP API for the Relay job queue.

    Conflict (409) problem `type` URIs:
    - `https://relay.dev/problems/lease-lost` — worker lost the lease
    - `https://relay.dev/problems/invalid-transition` — status does not allow the operation

    Long-poll leases use `wait_seconds` (0..30). The server `WriteTimeout` is 45s so it
    exceeds the maximum wait.
  version: 0.2.0
servers:
  - url: /
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness probe
      tags: [health]
      responses:
        "200":
          description: Process is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /readyz:
    get:
      operationId: getReadyz
      summary: Readiness probe
      tags: [health]
      responses:
        "200":
          description: Storage is reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Storage is unavailable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/jobs:
    post:
      operationId: enqueueJob
      summary: Enqueue a job
      tags: [jobs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnqueueRequest"
      responses:
        "200":
          description: Existing job returned for an idempotent replay
          headers:
            Idempotent-Replayed:
              description: Set to "true" when the response is an idempotent hit
              required: true
              schema:
                type: string
                enum: ["true"]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "201":
          description: Job created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/jobs/{id}:
    get:
      operationId: getJob
      summary: Get a job by ID
      tags: [jobs]
      parameters:
        - $ref: "#/components/parameters/JobID"
      responses:
        "200":
          description: Job found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/jobs/{id}/attempts:
    get:
      operationId: listJobAttempts
      summary: List attempt history for a job
      tags: [jobs]
      parameters:
        - $ref: "#/components/parameters/JobID"
      responses:
        "200":
          description: Attempt history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttemptsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/queues/{queue}/leases:
    post:
      operationId: leaseJobs
      summary: Lease jobs from a queue (optional long-poll)
      tags: [leases]
      parameters:
        - name: queue
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z0-9][a-z0-9_-]{0,63}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeaseRequest"
      responses:
        "200":
          description: Leased jobs (possibly empty after wait)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaseResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/jobs/{id}/heartbeat:
    post:
      operationId: heartbeatJob
      summary: Extend a job lease
      tags: [jobs]
      parameters:
        - $ref: "#/components/parameters/JobID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HeartbeatRequest"
      responses:
        "200":
          description: Lease extended (includes cancel_requested)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/jobs/{id}/complete:
    post:
      operationId: completeJob
      summary: Mark a job succeeded
      tags: [jobs]
      parameters:
        - $ref: "#/components/parameters/JobID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteRequest"
      responses:
        "200":
          description: Job succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/jobs/{id}/fail:
    post:
      operationId: failJob
      summary: Report a job failure
      tags: [jobs]
      parameters:
        - $ref: "#/components/parameters/JobID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FailRequest"
      responses:
        "200":
          description: Failure recorded (pending retry, dead, or cancelled)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/jobs/{id}/release:
    post:
      operationId: releaseJob
      summary: Voluntarily release a lease (does not consume an attempt)
      tags: [jobs]
      parameters:
        - $ref: "#/components/parameters/JobID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReleaseRequest"
      responses:
        "200":
          description: Job returned to pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/jobs/{id}/cancel:
    post:
      operationId: cancelJob
      summary: Cancel a pending job or request cancel on a running job
      tags: [jobs]
      parameters:
        - $ref: "#/components/parameters/JobID"
      responses:
        "200":
          description: Job cancelled or cancel requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/jobs/{id}/retry:
    post:
      operationId: retryJob
      summary: Retry a dead or cancelled job
      tags: [jobs]
      parameters:
        - $ref: "#/components/parameters/JobID"
      responses:
        "200":
          description: Job requeued as pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/queues:
    get:
      operationId: listQueues
      summary: List registered queues
      tags: [queues]
      responses:
        "200":
          description: Queue list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueuesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/queues/{queue}:
    get:
      operationId: getQueueStats
      summary: Queue statistics
      tags: [queues]
      parameters:
        - $ref: "#/components/parameters/QueueName"
      responses:
        "200":
          description: Stats for the queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueStats"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/queues/{queue}/pause:
    post:
      operationId: pauseQueue
      summary: Pause a queue (claims return empty)
      tags: [queues]
      parameters:
        - $ref: "#/components/parameters/QueueName"
      responses:
        "200":
          description: Queue paused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Queue"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/queues/{queue}/resume:
    post:
      operationId: resumeQueue
      summary: Resume a paused queue
      tags: [queues]
      parameters:
        - $ref: "#/components/parameters/QueueName"
      responses:
        "200":
          description: Queue resumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Queue"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/queues/{queue}/jobs:
    get:
      operationId: listQueueJobs
      summary: List jobs in a queue by status (keyset pagination)
      tags: [queues]
      parameters:
        - $ref: "#/components/parameters/QueueName"
        - name: status
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/JobStatus"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            description: Opaque keyset cursor from a previous page
      responses:
        "200":
          description: Page of jobs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/queues/{queue}/dead/retry:
    post:
      operationId: retryDeadJobs
      summary: Bulk-retry dead jobs in a queue
      tags: [queues]
      parameters:
        - $ref: "#/components/parameters/QueueName"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetryDeadRequest"
      responses:
        "200":
          description: Number of jobs retried
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetryDeadResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  parameters:
    JobID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    QueueName:
      name: queue
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9_-]{0,63}$'
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
    EnqueueRequest:
      type: object
      required: [queue, type]
      properties:
        queue:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{0,63}$'
        type:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$'
        payload:
          description: Opaque JSON payload (defaults to {})
          # Alias avoids duplicate encoding/json import in generated code.
          x-go-type: jraw.RawMessage
          x-go-type-import:
            name: jraw
            path: encoding/json
        priority:
          type: integer
          minimum: -100
          maximum: 100
        run_at:
          type: string
          format: date-time
        max_attempts:
          type: integer
          minimum: 1
          maximum: 100
        idempotency_key:
          type: string
          maxLength: 255
    LeaseRequest:
      type: object
      required: [worker_id]
      properties:
        worker_id:
          type: string
          minLength: 1
          maxLength: 128
        max_jobs:
          type: integer
          minimum: 1
          maximum: 100
        lease_seconds:
          type: integer
          minimum: 5
          maximum: 900
          description: Lease duration in seconds (default 30)
        wait_seconds:
          type: integer
          minimum: 0
          maximum: 30
          description: Long-poll wait in seconds (default 0 = return immediately)
    HeartbeatRequest:
      type: object
      required: [worker_id]
      properties:
        worker_id:
          type: string
          minLength: 1
          maxLength: 128
        lease_seconds:
          type: integer
          minimum: 5
          maximum: 900
    CompleteRequest:
      type: object
      required: [worker_id]
      properties:
        worker_id:
          type: string
          minLength: 1
          maxLength: 128
    FailRequest:
      type: object
      required: [worker_id, error]
      properties:
        worker_id:
          type: string
          minLength: 1
          maxLength: 128
        error:
          type: string
        permanent:
          type: boolean
          description: When true, mark the job dead without retry
    ReleaseRequest:
      type: object
      required: [worker_id]
      properties:
        worker_id:
          type: string
          minLength: 1
          maxLength: 128
    RetryDeadRequest:
      type: object
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 10000
          description: Max jobs to retry (default 1000)
    RetryDeadResponse:
      type: object
      required: [retried]
      properties:
        retried:
          type: integer
    LeaseResponse:
      type: object
      required: [jobs]
      properties:
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/Job"
    AttemptsResponse:
      type: object
      required: [attempts]
      properties:
        attempts:
          type: array
          items:
            $ref: "#/components/schemas/Attempt"
    Attempt:
      type: object
      required: [job_id, number, worker_id, started_at, outcome]
      properties:
        job_id:
          type: string
          format: uuid
        number:
          type: integer
        worker_id:
          type: string
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true
        outcome:
          type: string
          enum: [running, succeeded, failed, expired, released, cancelled]
        error:
          type: string
    QueuesResponse:
      type: object
      required: [queues]
      properties:
        queues:
          type: array
          items:
            $ref: "#/components/schemas/Queue"
    Queue:
      type: object
      required: [name, paused, created_at, updated_at]
      properties:
        name:
          type: string
        paused:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    QueueStats:
      type: object
      required:
        - queue
        - paused
        - pending
        - scheduled
        - running
        - succeeded
        - dead
        - cancelled
        - oldest_pending_age_seconds
      properties:
        queue:
          type: string
        paused:
          type: boolean
        pending:
          type: integer
          format: int64
        scheduled:
          type: integer
          format: int64
        running:
          type: integer
          format: int64
        succeeded:
          type: integer
          format: int64
        dead:
          type: integer
          format: int64
        cancelled:
          type: integer
          format: int64
        oldest_pending_age_seconds:
          type: integer
          format: int64
          description: Age in seconds of oldest due pending job (0 if none)
    JobPage:
      type: object
      required: [jobs, next_cursor]
      properties:
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/Job"
        next_cursor:
          type: string
          description: Empty string when this is the last page
    JobStatus:
      type: string
      enum: [pending, running, succeeded, dead, cancelled]
    Job:
      type: object
      required:
        - id
        - queue
        - type
        - payload
        - status
        - priority
        - run_at
        - attempts
        - max_attempts
        - cancel_requested
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        queue:
          type: string
        type:
          type: string
        payload:
          description: Opaque JSON payload
          x-go-type: jraw.RawMessage
          x-go-type-import:
            name: jraw
            path: encoding/json
        status:
          $ref: "#/components/schemas/JobStatus"
        priority:
          type: integer
        run_at:
          type: string
          format: date-time
        attempts:
          type: integer
        max_attempts:
          type: integer
        lease_owner:
          type: string
        lease_expires_at:
          type: string
          format: date-time
          nullable: true
        idempotency_key:
          type: string
        last_error:
          type: string
        cancel_requested:
          type: boolean
        cancelled_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          description: |
            Problem type URI. Conflict responses use
            https://relay.dev/problems/lease-lost or
            https://relay.dev/problems/invalid-transition.
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
  responses:
    BadRequest:
      description: Validation or malformed request
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: |
        Lease lost or invalid state transition.
        Problem type is https://relay.dev/problems/lease-lost or
        https://relay.dev/problems/invalid-transition.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PayloadTooLarge:
      description: Request body exceeds 1 MiB
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InternalError:
      description: Unexpected server error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
