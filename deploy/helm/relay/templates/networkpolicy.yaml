{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "relay.fullname" . }}
  labels:
    {{- include "relay.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "relay.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 7420
        - protocol: TCP
          port: 7421
      {{- if .Values.networkPolicy.ingressCIDRs }}
      from:
        {{- range .Values.networkPolicy.ingressCIDRs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      {{- end }}
    {{- if .Values.metrics.service.enabled }}
    - ports:
        - protocol: TCP
          port: 7429
      from:
        - podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.prometheusSelector | nindent 14 }}
    {{- end }}
{{- end }}
