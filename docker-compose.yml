services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "54329:5432"
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
      POSTGRES_DB: relay
    volumes:
      - relay_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d relay"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "63799:6379"
    volumes:
      - relay_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  relay-server:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      args:
        CMD: relay-server
        # Override when proxy.golang.org returns 403, e.g. COMPOSE_GOPROXY=https://goproxy.io,direct
        GOPROXY: ${COMPOSE_GOPROXY:-https://proxy.golang.org,direct}
    ports:
      - "7420:7420"
    environment:
      RELAY_HTTP_ADDR: ":7420"
      RELAY_STORAGE: ${RELAY_STORAGE:-postgres}
      RELAY_POSTGRES_URL: postgres://relay:relay@postgres:5432/relay?sslmode=disable
      RELAY_REDIS_URL: redis://redis:6379/0
      RELAY_REDIS_KEY_PREFIX: relay
      RELAY_MIGRATE_ON_START: "true"
      RELAY_RETRY_DELAY: 5s
      RELAY_SHUTDOWN_TIMEOUT: 45s
      RELAY_LOG_LEVEL: info
      RELAY_LOG_FORMAT: json
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s

  example-worker:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      args:
        CMD: example-worker
        GOPROXY: ${COMPOSE_GOPROXY:-https://proxy.golang.org,direct}
    deploy:
      replicas: 2
    environment:
      RELAY_URL: http://relay-server:7420
      RELAY_API_KEY: ${RELAY_API_KEY:-}
      RELAY_QUEUE: ${RELAY_QUEUE:-default}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-10}
    depends_on:
      relay-server:
        condition: service_healthy
    restart: unless-stopped

  example-producer:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      args:
        CMD: example-producer
        GOPROXY: ${COMPOSE_GOPROXY:-https://proxy.golang.org,direct}
    environment:
      RELAY_URL: http://relay-server:7420
      RELAY_API_KEY: ${RELAY_API_KEY:-}
      RELAY_QUEUE: ${RELAY_QUEUE:-default}
    depends_on:
      relay-server:
        condition: service_healthy
      example-worker:
        condition: service_started

volumes:
  relay_pgdata:
  relay_redisdata:
