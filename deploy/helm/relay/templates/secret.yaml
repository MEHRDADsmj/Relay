{{- if and .Values.secret.create (not .Values.secret.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "relay.secretName" . }}
  labels:
    {{- include "relay.labels" . | nindent 4 }}
type: Opaque
{{- if or .Values.secret.postgresUrl .Values.secret.redisUrl .Values.secret.apiKey }}
stringData:
  {{- if .Values.secret.postgresUrl }}
  RELAY_POSTGRES_URL: {{ .Values.secret.postgresUrl | quote }}
  {{- end }}
  {{- if .Values.secret.redisUrl }}
  RELAY_REDIS_URL: {{ .Values.secret.redisUrl | quote }}
  {{- end }}
  {{- if .Values.secret.apiKey }}
  RELAY_API_KEY: {{ .Values.secret.apiKey | quote }}
  {{- end }}
{{- else }}
data: {}
{{- end }}
{{- end }}
